substitutions:
  devicename: shelly-quincho
  devicetype: shelly plus 2pm # PCB v0.1.9
  formated_name: Shelly Quincho
  # Name for the relays
  channel_1: Fan
  channel_2: Lights
  max_power: "2000.0" # watt
  max_temp: "83.0" # °C

  comment: |-
    Placed in the quincho and controls the ceiling fan and the lights
    Relay 1 (S1 input) feeds the fan and must stay powered, the fan is
    controlled by its own controller, so the input is detached from the relay
    Relay 2 (S2 input) controls the quincho lights

# Dual core ESP32-U4WDH (post Sept 2022 PCB v0.1.9), so the arduino framework is fine
<<: !include common/esphome/esp32doit.yaml

<<: !include common/common.yaml

# Override the shared VERBOSE logger, it drowns out everything with i2c/adc noise
logger:
  level: DEBUG
  logs:
    i2c.idf: WARN
    ade7953: INFO
    sensor: INFO
    resistance: INFO
    adc: INFO
    preferences: INFO

i2c:
  sda: GPIO26
  scl: GPIO25

status_led:
  # GPIO0 is the stock Shelly LED. It is a boot strapping pin, but it is only
  # driven after boot and the board pulls it up, so the warning is noise here
  pin:
    number: GPIO0
    inverted: yes
    ignore_strapping_warning: true

output:
  - platform: gpio
    id: relay_output_1
    pin: GPIO13
  - platform: gpio
    id: relay_output_2
    pin:
      number: GPIO12
      ignore_strapping_warning: true

switch:
  # The fan needs permanent power, it is controlled downstream and not by S1
  - platform: output
    id: fan_relay
    name: ${channel_1} relay
    output: relay_output_1
    entity_category: config
    restore_mode: ALWAYS_ON
  - platform: restart
    name: "Restart"
    entity_category: config

light:
  - platform: binary
    name: ${channel_2}
    output: relay_output_2
    id: quincho_lights

binary_sensor:
  # Device button
  - platform: gpio
    name: "${formated_name} Button"
    pin:
      number: GPIO4
      inverted: yes
      mode:
        input: true
        pullup: true
    internal: true
  # Input 1, detached from the relay. The fan hangs off its own controller, so
  # the switch only toggles the HA fan entity and keeps the relay powered
  - platform: gpio
    id: input_1
    name: ${channel_1} input
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    # The Shelly SW inputs are line referenced, so a closed switch shows up as a
    # 100Hz pulse train rather than a steady level. delayed_off has to be long
    # enough to bridge the zero crossings or the input chatters and toggles twice
    filters:
      - delayed_on: 20ms
      - delayed_off: 120ms
    on_state:
      then:
        - switch.turn_on: fan_relay
        - if:
            condition:
              and:
                - wifi.connected:
                - api.connected:
            then:
              - homeassistant.action:
                  action: fan.toggle
                  data:
                    entity_id: fan.quincho_quincho_fan
  # Input 2 controls the lights. on_state so both edges of a toggle switch work
  - platform: gpio
    id: input_2
    name: ${channel_2} input
    pin:
      number: GPIO18
      mode:
        input: true
    # The Shelly SW inputs are line referenced, so a closed switch shows up as a
    # 100Hz pulse train rather than a steady level. delayed_off has to be long
    # enough to bridge the zero crossings or the input chatters and toggles twice
    filters:
      - delayed_on: 20ms
      - delayed_off: 120ms
    on_state:
      then:
        - logger.log:
            level: WARN
            format: "SW2 (GPIO18) changed to %d"
            args: ["id(input_2).state"]
        - light.toggle: quincho_lights


sensor:
  # Reports how long the device has been powered (in hours) since last reboot
  - platform: uptime
    name: ${formated_name} Uptime
    update_interval: 60s
    entity_category: diagnostic
    filters:
      - lambda: return x / 3600;
    unit_of_measurement: "h"
  - platform: wifi_signal
    name: "${formated_name} Wifi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # Power Sensor
  # On the Plus 2PM the channels are mixed: ch_a = relay 2, ch_b = relay 1
  - platform: ade7953_i2c
    irq_pin: GPIO27 # Prevent overheating by setting this
    voltage:
      name: ${formated_name} Voltage
      entity_category: diagnostic
    current_a:
      name: ${channel_2} Current
      entity_category: diagnostic
    active_power_a:
      name: ${channel_2} Power
      id: power_channel_2
      entity_category: diagnostic
      # active_power_a is inverted, so multiply by -1
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - light.turn_off: quincho_lights
            - homeassistant.action:
                action: persistent_notification.create
                data:
                  title: Message from ${formated_name}
                data_template:
                  message: ${channel_2} turned off because power exceeded ${max_power}W
    current_b:
      name: ${channel_1} Current
      entity_category: diagnostic
    active_power_b:
      name: ${channel_1} Power
      id: power_channel_1
      entity_category: diagnostic
      # active_power_b is inverted too, confirmed by negative readings on this unit
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: fan_relay
            - homeassistant.action:
                action: persistent_notification.create
                data:
                  title: Message from ${formated_name}
                data_template:
                  message: ${channel_1} turned off because power exceeded ${max_power}W
    update_interval: 10s

  - platform: total_daily_energy
    name: ${channel_1} Energy
    power_id: power_channel_1
    filters:
      # Multiplication factor from W to kWh is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh

  - platform: total_daily_energy
    name: ${channel_2} Energy
    power_id: power_channel_2
    filters:
      # Multiplication factor from W to kWh is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh

  # Internal NTC Temperature sensor
  - platform: ntc
    sensor: temp_resistance_reading
    name: ${formated_name} Temperature
    unit_of_measurement: °C
    accuracy_decimals: 1
    icon: mdi:thermometer
    entity_category: diagnostic
    calibration:
      b_constant: 3350
      reference_resistance: 4.7kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - light.turn_off: quincho_lights
          - switch.turn_off: fan_relay
          - homeassistant.action:
              action: persistent_notification.create
              data:
                title: Message from ${formated_name}
              data_template:
                message: Outputs turned off because temperature exceeded ${max_temp}°C

  # Required for NTC sensor
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 5.6kOhm

  # Required for NTC sensor
  - platform: adc
    id: temp_analog_reading
    pin: GPIO35
    attenuation: 12db
    update_interval: 10s
