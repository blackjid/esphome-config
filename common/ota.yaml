---
# OTA auth uses the API encryption key (Noise) instead of a password.
# Migration: password + allow_plaintext_upload let this one install reach
# devices still running password firmware. Once every device is flashed,
# delete both lines and keep only `encryption:`.
ota:
  platform: esphome
  password: !secret ota_password
  encryption:
    allow_plaintext_upload: true
