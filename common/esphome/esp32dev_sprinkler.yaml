---
esphome:
  name: ${devicename}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"  # Athom board is ESP32 rev3.1
      flash_chip: gd  # saves IRAM

preferences:
  flash_write_interval: 5min