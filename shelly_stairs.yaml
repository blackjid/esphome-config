substitutions:
  devicename: shelly-stairs
  formated_name: Shelly Stairs
  max_power: "2000.0" # watts
  max_temp: "83.0" # °C
  # Name for the relays
  channel_1: Stairs
  channel_2: Family Room

  comment: |-
    Smart Bulb connected to output relay_output_1
    Dumb Bulb connected to output relay_output_2

<<: !include common/esphome/esp32doit.yaml

<<: !include common/common.yaml

i2c:
  sda: GPIO26
  scl: GPIO25

status_led:
  # GPIO0 is the stock Shelly LED. It is a boot strapping pin, but it is only
  # driven after boot and the board pulls it up, so the warning is noise here
  pin:
    number: GPIO0
    inverted: yes
    ignore_strapping_warning: true

output:
  - platform: gpio
    id: relay_output_1
    pin:
      number: GPIO12
      ignore_strapping_warning: true
  - platform: gpio
    id: relay_output_2
    pin: GPIO13

switch:
  # Lifx Stairs bulb, it should always be on to be controlled via binary sensor
  - platform: output
    id: relay_1_switch
    name: ${channel_1} relay
    output: relay_output_1
    entity_category: config
    restore_mode: ALWAYS_ON
  - platform: restart
    name: "Restart"
    entity_category: config

light:
  - platform: binary
    name: ${channel_2} Light
    output: relay_output_2
    id: family_room_light

binary_sensor:
  # Device button
  - platform: gpio
    name: "${formated_name} Button"
    pin:
      number: GPIO4
      inverted: yes
      mode:
        input: true
        pullup: true
    internal: true
  # Input 1 Dumb Bulb
  - platform: gpio
    id: input_1
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    # Line referenced input, delayed_off has to bridge the AC zero crossings
    filters:
      - delayed_on: 20ms
      - delayed_off: 120ms
    on_state:
      then:
        - light.toggle: family_room_light
    internal: true
  # Input 2 Smart Bulb
  - platform: gpio
    id: input_2
    pin: GPIO18
    # Line referenced input, delayed_off has to bridge the AC zero crossings
    filters:
      - delayed_on: 20ms
      - delayed_off: 120ms
    on_state:
      if:
        condition:
          - switch.is_off: relay_1_switch
        then:
          - switch.turn_on: relay_1_switch
        else:
          - homeassistant.action:
              action: homeassistant.toggle
              data:
                entity_id: light.stairs
    internal: true

sensor:
  # Power Sensor
  - platform: ade7953_i2c
    irq_pin: GPIO27
    voltage:
      name: ${formated_name} Voltage
      entity_category: diagnostic
    current_a:
      name: ${channel_2} Current
      entity_category: diagnostic
    active_power_a:
      name: ${channel_2} Power
      id: power_channel_2
      entity_category: diagnostic
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - light.turn_off: family_room_light
            - homeassistant.action:
                action: persistent_notification.create
                data:
                  title: Message from ${formated_name}
                data_template:
                  message: Switch turned off because power exceeded ${max_power}W
    current_b:
      name: ${channel_1} Current
      entity_category: diagnostic
    active_power_b:
      name: ${channel_1} Power
      id: power_channel_1
      entity_category: diagnostic
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: relay_1_switch
            - homeassistant.action:
                action: persistent_notification.create
                data:
                  title: Message from ${formated_name}
                data_template:
                  message: Switch turned off because power exceeded ${max_power}W
    update_interval: 10s

  # Internal NTC Temperature sensor
  - platform: ntc
    sensor: temp_resistance_reading
    name: ${formated_name} Temperature
    unit_of_measurement: °C
    accuracy_decimals: 1
    icon: mdi:thermometer
    entity_category: diagnostic
    calibration:
      b_constant: 3350
      reference_resistance: 4.7kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - light.turn_off: family_room_light
          - switch.turn_off: relay_1_switch
          - homeassistant.action:
              action: persistent_notification.create
              data:
                title: Message from ${formated_name}
              data_template:
                message: Outputs turned off because temperature exceeded ${max_temp}°C

  # Required for NTC sensor
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 5.6kOhm

  # Required for NTC sensor
  - platform: adc
    id: temp_analog_reading
    pin: GPIO35
    attenuation: 12db
    update_interval: 10s
